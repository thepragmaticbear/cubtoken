[package]
name = "ctk-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "CLI and Claude Code hook installer for cubtoken"

[[bin]]
name = "ctk"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde_json.workspace = true
ctk-hook = { version = "0.1.1", path = "../ctk-hook" }

[dev-dependencies]
assert_cmd = "2"
serde_json.workspace = true
tempfile = "3"
