[package]
name = "stk-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "stk"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde_json.workspace = true
stk-hook = { path = "../stk-hook" }

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"
