[workspace]
resolver = "2"
members = ["crates/ctk-cli", "crates/ctk-hook", "crates/ctk-compress", "crates/ctk-sitter"]

[workspace.package]
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[profile.release]
lto = "thin"
strip = true
