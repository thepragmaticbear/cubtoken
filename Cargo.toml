[workspace]
resolver = "2"
members = ["crates/ctk-cli", "crates/ctk-hook", "crates/ctk-compress", "crates/ctk-sitter"]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/thepragmaticbear/cubtoken"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
strip = true
