# cubtoken project config — see https://github.com/brandonfla/cubtoken
[read]
enabled = true
threshold_tokens = 2000
never_compress = ["**/*.md", "**/.env*"]

[grep]
enabled = true
max_matches_per_file = 5

[glob]
enabled = true
max_paths = 50

[bash]
enabled = false  # set true if you don't use rtk

[stats]
ledger = true
